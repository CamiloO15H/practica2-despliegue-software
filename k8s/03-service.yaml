# Service NodePort: expone la API fuera del clúster en http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: practica2-api-svc
  namespace: practica2
  labels:
    app: practica2-api
spec:
  type: NodePort
  selector:
    app: practica2-api      # enruta el tráfico a los pods con esta label
  ports:
    - name: http
      protocol: TCP
      port: 80              # puerto del Service dentro del clúster
      targetPort: http      # puerto del contenedor (8080)
      nodePort: 30080       # puerto accesible desde la máquina (rango 30000-32767)
